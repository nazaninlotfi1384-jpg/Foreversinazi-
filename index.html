<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سایت من</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>سایت من 🌱</h1>
    <p>به سایت من خوش اومدی!</p>
  </header>

  <div class="container">

    <div class="box">
      <h2>📝 اولین مطلب</h2>

      <p>
        سلام! این اولین مطلب سایت منه.
        اینجا می‌تونم مطالب مختلف منتشر کنم.
      </p>
    </div>

    <div class="box">

      <h2>🗳️ نظرسنجی</h2>

      <p>کدوم موضوع رو بیشتر دوست داری؟</p>

      <button onclick="vote(1)">موضوع اول</button>
      <button onclick="vote(2)">موضوع دوم</button>
      <button onclick="vote(3)">موضوع سوم</button>

      <p>
        موضوع اول: <span id="vote1">0</span> رأی
        <br>
        موضوع دوم: <span id="vote2">0</span> رأی
        <br>
        موضوع سوم: <span id="vote3">0</span> رأی
      </p>

    </div>

  </div>

  <script>
    let votes = [0, 0, 0];

    function vote(option) {

      votes[option - 1]++;

      document.getElementById("vote1").textContent = votes[0];
      document.getElementById("vote2").textContent = votes[1];
      document.getElementById("vote3").textContent = votes[2];

    }
  </script>

</body>
</html>
<body>

  <div class="welcome">
    <h1>سینای من، خوش اومدی 🤍</h1>

    <p>
      اینجا قراره مشکلاتمونو در میون بذاریم،
      حرف بزنیم و نظر بدیم.
    </p>

    <button>ورود به مطالب</button>
    <button>نظرسنجی</button>
  </div>

</body>
